<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emblemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFDAB9;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Emblem Circle -->
  <g filter="url(#shadow)">
    <circle cx="50" cy="50" r="48" fill="url(#emblemGradient)" stroke="#2D5A27" stroke-width="1.5" />
    
    <!-- Overlapping Leaves -->
    <path d="M 50 15 C 32 30 32 70 50 85 C 36 70 36 30 50 15" fill="#2D5A27" />
    <path d="M 50 15 C 68 30 68 70 50 85 C 64 70 64 30 50 15" fill="#3E7D36" opacity="0.9" />
    <path d="M 50 15 L 50 85" stroke="#FFF3E9" stroke-width="0.8" opacity="0.4" />
  </g>

  <!-- Text Section -->
  <g style="font-family: 'Playfair Display', serif; font-weight: 700;">
    <text x="110" y="42" font-size="38" fill="#FFFFFF">Moroccan</text>
    <text x="110" y="78" font-size="38" fill="#FFFFFF">Cosmetic</text>
  </g>
  <text x="110" y="96" font-family="'Inter', sans-serif" font-weight="600" font-size="16" letter-spacing="8" fill="#FF9F68">PRODUCTS</text>
</svg>
